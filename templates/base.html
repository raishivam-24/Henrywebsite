<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        (function () {
            try {
                var t = localStorage.getItem('clinic-theme') || 'light';
                var l = localStorage.getItem('clinic-lang') || 'en';
                document.documentElement.setAttribute('data-theme', t);
                document.documentElement.setAttribute('data-lang', l);
                document.documentElement.lang = l === 'hi' ? 'hi' : 'en';
            } catch (e) {}
        })();
    </script>
    <title>{% block title %}Dr Henry's Skin Clinic | Dermatology in Bilaspur, Chhattisgarh{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}Dr Henry's Skin Clinic at Usha Memorial Skin & Eye Hospital, Ware House Rd, Sindhi Colony, Bilaspur. Trusted since 2000 for dermatology, laser, aesthetics and hair care. Call +91 97700 48965.{% endblock %}">
    <meta name="robots" content="index, follow, max-image-preview:large">
    <link rel="canonical" href="{% block canonical %}https://ushamemorial.co.in/{% endblock %}">

    <link rel="icon" href="/static/img/favicon.ico" sizes="any">
    <link rel="icon" type="image/webp" href="/static/img/favicon-32.webp">
    <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Dr Henry's Skin Clinic">
    <meta property="og:title" content="{% block og_title %}Dr Henry's Skin Clinic | Dermatology in Bilaspur{% endblock %}">
    <meta property="og:description" content="{% block og_description %}Trusted dermatology clinic in Bilaspur since 2000. Book an appointment for skin, laser, hair and aesthetic care.{% endblock %}">
    <meta property="og:url" content="{% block og_url %}https://ushamemorial.co.in/{% endblock %}">
    <meta property="og:image" content="{% block og_image %}https://ushamemorial.co.in/static/img/og-image.webp{% endblock %}">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:locale" content="en_IN">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{% block twitter_title %}Dr Henry's Skin Clinic | Dermatology in Bilaspur{% endblock %}">
    <meta name="twitter:description" content="{% block twitter_description %}Trusted dermatology clinic in Bilaspur since 2000. Call +91 97700 48965.{% endblock %}">
    <meta name="twitter:image" content="{% block twitter_image %}https://ushamemorial.co.in/static/img/og-image.webp{% endblock %}">

    {% block structured_data %}{% endblock %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css?v=10">
    <link rel="stylesheet" href="/static/enhance.css?v=4">
    <link rel="stylesheet" href="/static/theme.css?v=3">
    <link rel="stylesheet" href="/static/ui.css?v=4">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Serif+Devanagari:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --sage-100: #E8EFE8;
            --sage-200: #D4E8CD;
            --sage-300: #AFC1AB;
            --sage-400: #AEC0AA;
            --sage-500: #8FA88C;
        }
        .bg-sage { background-color: var(--sage-200) !important; }
        .bg-sage-light { background-color: var(--sage-100) !important; }
        .text-sage { color: var(--sage-300) !important; }
        .border-sage { border-color: var(--sage-300) !important; }
    </style>
</head>
<body class="bg-white">
    {% block content %}{% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="/static/script.js?v=3"></script>
    <script src="/static/enhance.js?v=3"></script>
    <script src="/static/theme.js?v=3"></script>
    <script src="/static/ui.js?v=2"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
